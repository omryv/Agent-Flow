<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AgentFlow — Counterfactual Trace Engine</title>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <div id="app"></div>

  <script>
    /* ── TEMP DEBUG — remove once working ── */
    window.onerror = function(msg, src, line, col, err) {
      document.body.style.cssText = 'background:#0f1117;color:#ff6b6b;font:13px/1.8 monospace;padding:32px;white-space:pre-wrap;';
      document.body.textContent   = 'JS ERROR\n\n'
        + 'Message : ' + msg  + '\n'
        + 'File    : ' + src  + '\n'
        + 'Line    : ' + line + '\n'
        + 'Col     : ' + col  + '\n\n'
        + (err && err.stack ? err.stack : '');
    };
  </script>

  <script src="js/constants.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/adapters.js"></script>
  <script src="js/drag.js"></script>
  <script src="js/render.js"></script>
  <script src="js/events.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
