async function verifyState() {
  // Close any stale overlay
  _closeVerify();

  const totalTests = _VERIFY_GROUPS.reduce((s, g) => s + g.tests.length, 0);
  let completed = 0;

  // ── Mount fixed overlay — appended to <body>, immune to app re-renders ──
  _verifyOverlay = document.createElement('div');
  _verifyOverlay.id = 'verify-overlay';
  _verifyOverlay.setAttribute('role', 'dialog');
  _verifyOverlay.setAttribute('aria-modal', 'true');
  _verifyOverlay.setAttribute('aria-label', 'State Verification Report');
  _verifyOverlay.tabIndex = -1;
  _verifyOverlay.innerHTML = `
    <div id="verify-panel">
      <div id="verify-panel-hdr">
        <div class="verify-hdr-left">
          <div id="verify-icon">${ICONS.shield}</div>
          <div>
            <div class="verify-panel-title">State Verification Report</div>
            <div class="verify-panel-sub">VISIGENCE · AgentFlow · Engineered by Omry Damari</div>
          </div>
        </div>
        <button class="verify-close-btn" id="verify-close-btn" title="Close (Esc)">✕</button>
      </div>
      <div id="verify-progress-wrap">
        <div id="verify-progress"><div id="verify-progress-fill"></div></div>
        <span id="verify-pct-label">0 / ${totalTests} checks</span>
      </div>
      <div id="verify-cert-banner" class="verify-cert-loading">
        <div class="verify-spinner" id="verify-cert-spinner"></div>
        <div>
          <div id="verify-cert-title">Running ${totalTests} checks across ${_VERIFY_GROUPS.length} groups…</div>
          <div id="verify-cert-sub">Network · Security · Logic Engine · Adapters · Runtime Safety</div>
        </div>
        <div id="verify-cert-stats"></div>
      </div>
      <div id="verify-body"></div>
      <div id="verify-footer-bar">
        <span id="verify-sig">Signed · <strong>Omry Damari</strong></span>
        <span id="verify-timing-label"></span>
        <div style="flex:1"></div>
        <button id="verify-copy-btn" class="verify-copy-btn" style="display:none">Copy report</button>
        <button class="btn primary" style="height:28px;font-size:12px" id="verify-done-btn">Done</button>
      </div>
    </div>`;
  document.body.appendChild(_verifyOverlay);
  _verifyOverlay.focus();

  // Wire close: button, Esc key
  const doClose = () => _closeVerify();
  document.getElementById('verify-close-btn')?.addEventListener('click', doClose);
  document.getElementById('verify-done-btn')?.addEventListener('click', doClose);
  _verifyOverlay.addEventListener('keydown', e => { if (e.key === 'Escape') doClose(); });

  const verifyBody = document.getElementById('verify-body');
  const progFill   = document.getElementById('verify-progress-fill');
  const pctLabel   = document.getElementById('verify-pct-label');

  // ── Run tests live, group by group, updating DOM as each check completes ──
  const allResults = [];
  const t0 = performance.now();

  for (const g of _VERIFY_GROUPS) {
    const groupEl = document.createElement('div');
    groupEl.className = 'verify-group';
    groupEl.innerHTML = `
      <div class="verify-group-title">
        <span class="vg-name">${esc(g.title)}</span>
        <span class="vg-desc">${esc(g.desc)}</span>
        <span class="vg-badge vg-running">…</span>
      </div>
      ${g.explain ? `<div class="verify-explain">${esc(g.explain)}</div>` : ''}
      <div class="vg-rows"></div>`;
    verifyBody?.appendChild(groupEl);
    const rowsEl = groupEl.querySelector('.vg-rows');
    const badge  = groupEl.querySelector('.vg-badge');

    const rows = [];
    for (const fn of g.tests) {
      const t1 = performance.now();
      let r; try { r = await fn(); } catch(err) { r = _vFail(fn.name || 'check', err.message); }
      r._ms = Math.round(performance.now() - t1);
      rows.push(r);
      completed++;

      // Append this row live
      const rowEl = document.createElement('div');
      rowEl.className = 'verify-row';
      rowEl.innerHTML = _buildRowHTML(r);
      rowsEl?.appendChild(rowEl);

      // Update progress bar
      const pct = Math.round(completed / totalTests * 100);
      if (progFill) progFill.style.width = pct + '%';
      if (pctLabel) pctLabel.textContent = `${completed} / ${totalTests} checks`;
    }

    // Update group badge when all its tests finish
    const gFail = rows.filter(r => r.status === 'fail').length;
    const gWarn = rows.filter(r => r.status === 'warn').length;
    const gPass = rows.filter(r => r.status === 'pass').length;
    if (badge) {
      badge.className = 'vg-badge ' + (gFail > 0 ? 'vg-fail' : gWarn > 0 ? 'vg-warn' : 'vg-pass');
      badge.textContent = gFail > 0 ? `${gFail} FAIL` : gWarn > 0 ? `${gWarn} WARN` : `${gPass} PASS`;
    }
    allResults.push({ ...g, rows });
  }

  const totalMs = Math.round(performance.now() - t0);
  const allRows = allResults.flatMap(g => g.rows);
  const pass    = allRows.filter(r => r.status === 'pass').length;
  const fail    = allRows.filter(r => r.status === 'fail').length;
  const warn    = allRows.filter(r => r.status === 'warn').length;
  const info    = allRows.filter(r => r.status === 'info').length;
  const total   = allRows.length;

  // ── Update trust certificate banner ──
  const certBanner = document.getElementById('verify-cert-banner');
  const spinner    = document.getElementById('verify-cert-spinner');
  const certTitle  = document.getElementById('verify-cert-title');
  const certSub    = document.getElementById('verify-cert-sub');
  const certStats  = document.getElementById('verify-cert-stats');

  if (spinner) spinner.remove();

  const certCls    = fail > 0 ? 'fail' : warn > 0 ? 'warn' : 'pass';
  const certSvg    = fail > 0
    ? `<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="9.5" stroke="var(--rose)" stroke-width="1.5"/><path d="M7 7l8 8M15 7l-8 8" stroke="var(--rose)" stroke-width="1.8" stroke-linecap="round"/></svg>`
    : warn > 0
    ? `<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 2.5L20.5 19H1.5L11 2.5Z" stroke="var(--gold3)" stroke-width="1.5" stroke-linejoin="round"/><path d="M11 9v5" stroke="var(--gold3)" stroke-width="1.8" stroke-linecap="round"/><circle cx="11" cy="16.5" r=".9" fill="var(--gold3)"/></svg>`
    : `<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="9.5" stroke="var(--success)" stroke-width="1.5"/><path d="M6.5 11l3.5 3.5 5.5-7" stroke="var(--success)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const iconBorder = fail > 0 ? 'rgba(255,85,119,.35)' : warn > 0 ? 'rgba(255,209,102,.35)' : 'rgba(74,222,128,.35)';
  const titleText  = fail > 0 ? `${fail} check${fail!==1?'s':''} failed` : warn > 0 ? `${pass}/${total} passed · ${warn} warning${warn!==1?'s':''}` : `All ${total} checks passed`;
  const subText    = fail > 0
    ? 'Review the failed items below and check your deployment configuration.'
    : warn > 0
    ? 'App is safe and read-only — warnings are informational or relate to hosting-level headers.'
    : 'This app is fully client-side and read-only. No data leaves this page. Fully auditable via View Source.';

  if (certBanner) certBanner.className = 'verify-cert-' + certCls;

  const iconEl = document.createElement('div');
  iconEl.className = 'verify-cert-icon';
  iconEl.style.borderColor = iconBorder;
  iconEl.innerHTML = certSvg;
  certBanner?.insertBefore(iconEl, certBanner.firstChild);

  if (certTitle) certTitle.textContent = titleText;
  if (certSub)   certSub.textContent   = subText;
  if (certStats) {
    certStats.innerHTML = [
      `<div class="cert-stat" style="color:var(--success)"><span class="cs-num">${pass}</span><span class="cs-lbl">PASS</span></div>`,
      warn ? `<div class="cert-stat" style="color:var(--gold3)"><span class="cs-num">${warn}</span><span class="cs-lbl">WARN</span></div>` : '',
      fail ? `<div class="cert-stat" style="color:var(--rose)"><span class="cs-num">${fail}</span><span class="cs-lbl">FAIL</span></div>` : '',
      info ? `<div class="cert-stat" style="color:var(--gold2)"><span class="cs-num">${info}</span><span class="cs-lbl">INFO</span></div>` : '',
    ].join('');
  }

  if (progFill) progFill.style.width = '100%';
  if (pctLabel) pctLabel.textContent = `${total} / ${total} checks · ${totalMs}ms total`;

  const timingEl = document.getElementById('verify-timing-label');
  if (timingEl) timingEl.textContent = new Date().toLocaleTimeString();

  // ── Build plain-text report for clipboard ──
  const plainReport = [
    'VISIGENCE — State Verification Report',
    'Engineered by Omry Damari',
    `Run at: ${new Date().toISOString()}`,
    `Result: ${titleText}`,
    `Checks: ${pass} pass · ${fail} fail · ${warn} warn · ${info} info of ${total} total`,
    `Duration: ${totalMs}ms`,
    '',
    ...allResults.flatMap(g => [
      `── ${g.title} ──`,
      ...g.rows.map(r => `  [${r.status.toUpperCase().padEnd(4)}] ${r.name}  (${r._ms}ms)`),
      '',
    ]),
    'This report was generated in-browser. All checks are real and auditable via View Source.',
  ].join('\n');

  const copyBtn = document.getElementById('verify-copy-btn');
  if (copyBtn) {
    copyBtn.style.display = '';
    copyBtn.addEventListener('click', () => {
      navigator.clipboard?.writeText(plainReport)
        .then(() => { copyBtn.textContent = 'Copied!'; setTimeout(() => { copyBtn.textContent = 'Copy report'; }, 2000); })
        .catch(() => {});
    });
  }
}

const ACTIONS = {
  closeModal, doImport, handleExport, openImportDialog, materializeCounterfactual, generateCounterfactuals,
  selectRun, selectNode, setTab, setCf, toggleCf, setSearch, verifyState,
  modalBackdrop(_id, el, e) { if (e.target===el) closeModal(); },
};

function _dispatch(action, id, el, e) {
  const fn=ACTIONS[action]; if (typeof fn!=='function') return;
  try { fn(id,el,e); } catch(err) { console.error('[AgentFlow]',err); }
}

function _delegatedClick(e) { const t=e.target.closest('[data-action]'); if(t) _dispatch(t.dataset.action,t.dataset.id,t,e); }
function _delegatedChange(e) { const t=e.target.closest('[data-change]'); if(t) _dispatch(t.dataset.change,t.value,t,e); }

function _onKey(e) {
  const tag=document.activeElement?.tagName;
  const inField=['INPUT','TEXTAREA','SELECT'].includes(tag);
  const mod=e.metaKey||e.ctrlKey;
  if (e.key==='Escape') { if(_verifyOverlay){_closeVerify();return;} if(_modal){closeModal();return;} if(state.selectedNodeId){setState({selectedNodeId:null});return;} }
  if (inField||_modal||_verifyOverlay) return;
  if (mod&&!e.shiftKey&&!e.altKey) {
    if (e.key==='i'||e.key==='I') { e.preventDefault(); openImportDialog(); return; }
    if (e.key==='e'||e.key==='E') { e.preventDefault(); handleExport(); return; }
  }
  if (!mod&&!e.altKey&&!e.shiftKey) {
    if (e.key==='/') { e.preventDefault(); document.querySelector('.search-box input')?.focus(); return; }
    if (e.key==='g'||e.key==='G') { e.preventDefault(); setTab('graph'); return; }
    if (e.key==='c'||e.key==='C') { e.preventDefault(); setTab('counterfactuals'); return; }
    if (e.key==='ArrowUp')   { e.preventDefault(); _cycleRun(-1); return; }
    if (e.key==='ArrowDown') { e.preventDefault(); _cycleRun(1); return; }
    if (e.key==='ArrowLeft') { e.preventDefault(); _cycleNode(-1); return; }
    if (e.key==='ArrowRight'){ e.preventDefault(); _cycleNode(1); return; }
  }
}
function _cycleRun(d) { if(!state.runs.length) return; const i=state.runs.findIndex(r=>r.id===state.activeRunId); selectRun(state.runs[(i+d+state.runs.length)%state.runs.length].id); }
function _cycleNode(d) { const view=getActiveRunView(); if(!view||!view.run.nodes.length) return; const nodes=view.run.nodes, i=nodes.findIndex(n=>n.id===state.selectedNodeId); setState({selectedNodeId:(i===-1?nodes[0]:nodes[(i+d+nodes.length)%nodes.length]).id}); }

function attachEvents() {}

document.addEventListener('click', _delegatedClick);
document.addEventListener('change', _delegatedChange);
document.addEventListener('keydown', _onKey);
document.addEventListener('paste', _onPaste);

render();
