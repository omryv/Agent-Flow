<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Content-Security-Policy"
        content="
          default-src 'none';
          script-src 'self';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data:;
          font-src 'self' data:;
          connect-src 'none';
          media-src 'none';
          object-src 'none';
          frame-src 'none';
          child-src 'none';
          worker-src 'none';
          manifest-src 'self';
          base-uri 'none';
          form-action 'none';
          frame-ancestors 'none';
          upgrade-insecure-requests;
          block-all-mixed-content">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#07080d">
  <title>AgentFlow</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <div id="app"></div>
  <noscript><div style="padding:24px;color:#ecf0fb;font-family:system-ui">This app requires JavaScript.</div></noscript>

  <script type="module">
    import * as Facts from './js/facts.js';
    import * as Graph from './js/graph.js';
    import * as Revision from './js/revision.js';
    import * as Explain from './js/explain.js';
    window.LogicEngine = {
      Fact: Facts.Fact,
      Query: Facts.Query,
      parseFacts: Facts.parseFacts,
      factSetUnion: Facts.factSetUnion,
      factSetDifference: Facts.factSetDifference,
      isReachable: Graph.isReachable,
      findPath: Graph.findPath,
      computeClosure: Graph.computeClosure,
      edgesOnPaths: Graph.edgesOnPaths,
      Revision: Revision.Revision,
      reviseToFalsify: Revision.reviseToFalsify,
      reviseToSatisfy: Revision.reviseToSatisfy,
      explainRevision: Explain.explainRevision,
      explainAll: Explain.explainAll,
    };
  </script>
  <script src="js/counterfactual.js"></script>

  <script src="js/constants.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/adapters.js"></script>
  <script src="js/render.js"></script>
  <script src="js/events.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
